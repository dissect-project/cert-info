[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cert_info"
version = "0.0.3"
description = "Package that allows to verify the certificate chain of a given domain."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
keywords = []
authors = [
    { name = "Diogo Ribeiro", email = "diogo.p.ribeiro@inesctec.pt" },
    { name = "João Marco Silva", email = "joaomarco@di.uminho.pt" }
]
dependencies = ["requests"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[tool.setuptools.package-data]
"cert_info" = ["testssl/**"]

[tool.setuptools.packages.find]
where = ["."]

[project.urls]
Homepage = "https://github.com/dissect-project/cert-info"

[project.scripts]
cert-info = "cert_info.cli:main"
