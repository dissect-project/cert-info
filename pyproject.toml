[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cert-info"
version = "0.0.1"
description = "Package that allows to verify the certificate chain of a given domain,"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
keywords = []
authors = [
    { name = "Diogo Ribeiro", email = "diogo.p.ribeiro@inesctec.pt" },
    { name = "João Marco Silva", email = "joaomarco@di.uminho.pt" }
]
dependencies = []

[project.urls]
Homepage = "https://github.com/dissect-project/cert-info"
