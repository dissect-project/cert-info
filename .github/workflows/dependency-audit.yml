# Known vulnerabilities (PyPI advisory database, OSV) in the pinned
# dependencies. Runs when the requirements change and weekly, since new
# advisories appear without any change to the repository.
name: Dependency audit

on:
  push:
    branches: [dev, main]
    paths: ["requirements*.txt", "pyproject.toml", ".github/workflows/dependency-audit.yml"]
  pull_request:
    paths: ["requirements*.txt", "pyproject.toml", ".github/workflows/dependency-audit.yml"]
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit requirements.txt
        run: pip-audit --requirement requirements.txt --desc
