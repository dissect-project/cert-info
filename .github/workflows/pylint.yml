name: Pylint

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
    - name: Analysing the code with pylint
      run: |
        OUTPUT=$(pylint $(git ls-files '*.py'))
        echo "$OUTPUT"
        SCORE=$(echo "$OUTPUT" | grep -oP '(?<=Your code has been rated at )[\d\.]+')
        if (( $(echo "$SCORE < 9" | bc -l) )); then
          echo "❌ Pylint score ($SCORE) is below 9. Build has failed."
          exit 1
        else
          echo "✅ Pylint score ($SCORE) meets the requirement (>= 9.0)."
        fi
