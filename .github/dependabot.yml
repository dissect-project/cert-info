# Weekly pull requests for outdated dependencies (security updates are opened
# as soon as an advisory is published, if Dependabot security updates are
# enabled in Settings > Code security).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies]
